# Which provider and model FlowTrace uses.
# To switch models later, change only these two lines.
provider: meta
model: muse-spark-1.3

# Connection details for each provider.
# api_key_env is the NAME of the variable in .env, not the key itself.
providers:
  meta:
    base_url: https://api.meta.ai/v1
    api_key_env: MODEL_API_KEY